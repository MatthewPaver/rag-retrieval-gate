name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint and type check
        run: |
          python -m pip install ruff==0.16.10 mypy==2.1.0
          ruff check .
          ruff format --check .
          mypy
      - name: Unit tests
        run: python -m pytest -q
      - name: Retrieval gate (offline fixture)
        run: >
          rag-gate gate --dataset fixtures/policies.json --k 3
          --baseline configs/baseline.json
          --candidate configs/candidate-bm25-b05.json
          --max-drop 0.02 --output reports/gate.json --html reports/gate.html
      - name: Gate self-test (known regression must fail)
        # Six questions give a bootstrap no power, so the fixture tripwire is threshold-only.
        run: |
          set +e
          rag-gate gate --dataset fixtures/policies.json --k 3 \
            --baseline configs/baseline.json \
            --candidate configs/candidate-chunk-12.json --max-drop 0.02 --no-bootstrap
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected exit 1 from a known regression, got $status"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gate-report-py${{ matrix.python-version }}
          path: reports/gate.*
          if-no-files-found: ignore
