[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-retrieval-gate"
version = "0.1.0"
description = "Regression gate for RAG retrieval: hit@k, MRR and citation checks, baseline vs candidate, non-zero exit on regression."
readme = "README.md"
license = "MIT"
authors = [{ name = "Matthew Paver" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dense = ["numpy>=1.26", "sentence-transformers>=3.0"]
dev = ["pytest>=8", "numpy>=1.26"]

[project.scripts]
rag-gate = "rag_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
